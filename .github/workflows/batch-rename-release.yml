name: Batch Rename CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag matching Info.plist (vX.Y.Z or vX.Y.Z-beta)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: batch-rename-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Prepare isolated Apple Silicon build
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/batch-rename-scratch"
          printf 'BATCH_RENAME_SCRATCH=%s\n' "$RUNNER_TEMP/batch-rename-scratch" >> "$GITHUB_ENV"
      - name: App and native preview tests
        run: bash scripts/test-direct.sh
      - name: Package and verify rename and undo
        run: |
          bash scripts/package.sh --direct
          source scripts/env.sh
          "build/Batch Rename.app/Contents/MacOS/BatchRename" --verify
          codesign --verify --deep --strict 'build/Batch Rename.app'
      - name: Update archive, publisher, and Worker tests
        run: |
          bash scripts/test-update-bundle.sh
          python3 scripts/test-publish-update.py
          node --test workers/batch-rename/*.test.mjs
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    environment: batch-rename-release
    concurrency:
      group: batch-rename-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Prepare isolated release build
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/batch-rename-scratch"
          printf 'BATCH_RENAME_SCRATCH=%s\n' "$RUNNER_TEMP/batch-rename-scratch" >> "$GITHUB_ENV"
      - name: Validate scope and public configuration
        run: |
          python3 - <<'PY'
          import os, plistlib, json, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-beta)?', tag)
          info = plistlib.load(open('Resources/Info.plist', 'rb'))
          assert tag.removesuffix('-beta') == 'v' + info['CFBundleShortVersionString']
          assert info['CFBundleIdentifier'] == 'com.vortexopenclaw.batch-rename'
          json.load(open('Resources/UpdateConfiguration.json'))
          PY
      - name: Package ad-hoc signed app
        run: |
          bash scripts/package.sh --direct
          source scripts/env.sh
          "build/Batch Rename.app/Contents/MacOS/BatchRename" --verify
          python3 scripts/release-update.py 'build/Batch Rename.app' build/release
          swiftc -I build -L build -lRenameCore -Xlinker -rpath -Xlinker "$PWD/build" scripts/sign-update.swift -o build/sign-update
          swiftc -I build -L build -lRenameCore -Xlinker -rpath -Xlinker "$PWD/build" scripts/verify-release.swift -o build/verify-release
      - name: Sign manifest using only Batch Rename release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.BATCH_RENAME_ED25519_PRIVATE_KEY }}
        run: |
          set +x
          printf '%s' "$RELEASE_SIGNING_KEY" | build/sign-update build/release/unsigned.json build/release/manifest.json
      - name: Verify signed release
        run: build/verify-release build/release/manifest.json build/release/*.zip
      - name: Create draft GitHub release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-beta ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "Batch Rename $RELEASE_TAG" --notes 'Ad-hoc signed Apple Silicon build. See repository distribution and recovery instructions.' build/release/*.zip build/release/manifest.json
